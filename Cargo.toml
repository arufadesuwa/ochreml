[package]
name = "ochreml"
version = "0.3.4-alpha.2"
edition = "2024"
description = "Classical Machine Learning Library in Rust with PyO3 Bindings (*^▽^*)"
license = "MIT OR Apache-2.0"
readme = "README.md"

[lib]
name = "_ochreml"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29.3", features = ["extension-module"] }
rayon = "1.10"
thiserror = "2.0"
libloading = "0.8"
wgpu = { version = "24.0", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1.21", features = ["derive"], optional = true }

[features]
default = ["cuda-dynamic", "wgpu-backend", "tpu-pjrt"]
cuda-dynamic = []
wgpu-backend = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
tpu-pjrt = []

[profile.release]
lto = true
opt-level = 3
