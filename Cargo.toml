[package]
name = "ochreml"
version = "0.2.0"
edition = "2024"
description = "Classical Machine Learning Library in Rust with PyO3 Bindings (*^▽^*)"
license = "MIT OR Apache-2.0"
readme = "README.md"

[lib]
name = "_ochreml"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29.3", features = ["extension-module"] }

[profile.release]
lto = true
opt-level = 3
